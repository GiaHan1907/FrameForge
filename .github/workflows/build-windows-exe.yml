name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build one-file executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --name VideoScreenshotFilter video_screenshot_filter.spec

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: VideoScreenshotFilter-windows
          path: dist/VideoScreenshotFilter.exe
