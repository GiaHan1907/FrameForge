name: FrameForge Windows Release

on:
  # Chỉ build Windows nặng khi phát hành tag; PR vẫn chạy quick-check.
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      profile:
        description: "PyInstaller profile"
        required: true
        default: minimal
        type: choice
        options:
          - minimal
          - full
      publish_release:
        description: "Publish GitHub Release when running manually from a tag"
        required: true
        default: false
        type: boolean
      channel:
        description: "Update channel"
        required: true
        default: stable
        type: choice
        options:
          - stable
          - beta

concurrency:
  group: frameforge-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile Python sources
        shell: bash
        run: |
          python -m py_compile streamlit_app.py video_screenshot_advanced.py video_downloader.py updater.py app_update.py windows_launcher.py measure_package_size.py validate_release_manifest.py timeline_utils.py persistent_queue.py benchmarks/benchmark_frame_extraction.py tests/test_queue_retry_cancel.py tests/test_cache_checkpoint.py tests/test_app_update_channels.py tests/test_persistent_queue.py

      - name: Install test dependencies
        shell: bash
        run: python -m pip install -r requirements.txt
      - name: Run queue retry and cancel tests
        shell: bash
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run extraction benchmark
        shell: bash
        run: python benchmarks/benchmark_frame_extraction.py --frames 24 --workers 1,2 --output benchmark_results.json
      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v6
        with:
          name: frameforge-benchmark
          path: |
            benchmark_results.json
            benchmark_results.csv
          if-no-files-found: error
          retention-days: 14

  windows-build:
    if: github.event_name != 'pull_request'
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONIOENCODING: utf-8
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      FRAMEFORGE_SKIP_VENV: "1"

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements_full.txt

      - name: Select profile and version
        run: |
          $requestedProfile = "${{ github.event.inputs.profile }}"
          $requestedChannel = "${{ github.event.inputs.channel }}"
          if ([string]::IsNullOrWhiteSpace($requestedChannel)) {
            $requestedChannel = "stable"
          }
          if (@("stable", "beta") -notcontains $requestedChannel) {
            throw "Unsupported UPDATE_CHANNEL: $requestedChannel"
          }
          if ([string]::IsNullOrWhiteSpace($requestedProfile)) {
            $requestedProfile = "minimal"
          }
          if (@("minimal", "full") -notcontains $requestedProfile) {
            throw "Unsupported BUILD_PROFILE: $requestedProfile"
          }

          $refName = "${{ github.ref_name }}"
          $isTag = "${{ github.ref }}" -match '^refs/tags/'
          if ($isTag -and $refName -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tags must use vMAJOR.MINOR.PATCH, got '$refName'"
          }
          if ("${{ github.event.inputs.publish_release }}" -eq "true" -and -not $isTag) {
            throw "publish_release=true is only valid when manually running from a version tag"
          }
          if ($refName -match '^v?(\d+\.\d+\.\d+)$') {
            $version = $Matches[1]
          } else {
            $version = "0.0.${{ github.run_number }}"
          }

          "BUILD_PROFILE=$requestedProfile" >> $env:GITHUB_ENV
          "FRAMEFORGE_CHANNEL=$requestedChannel" >> $env:GITHUB_ENV
          "BUILD_MODE=onedir" >> $env:GITHUB_ENV
          "FRAMEFORGE_VERSION=$version" >> $env:GITHUB_ENV
          "FRAMEFORGE_TAG=$refName" >> $env:GITHUB_ENV
          Write-Host "Profile: $requestedProfile"
          Write-Host "Version: $version"

      - name: Build PyInstaller onedir package
        run: |
          cmd /c build_windows.bat
          if ($LASTEXITCODE -ne 0) {
            throw "build_windows.bat failed with exit code $LASTEXITCODE"
          }
      - name: Run queue retry and cancel tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Run extraction benchmark
        run: python benchmarks/benchmark_frame_extraction.py --frames 60 --workers 1,2,4 --output benchmark_results.json
      - name: Validate packaged build outputs
        run: |
          $versionFile = (Get-Content frameforge_version.txt -Raw).Trim()
          if ($versionFile -ne $env:FRAMEFORGE_VERSION) {
            throw "frameforge_version.txt contains '$versionFile', expected '$env:FRAMEFORGE_VERSION'"
          }
          if (-not (Test-Path "dist\VideoScreenshotFilter\VideoScreenshotFilter.exe")) {
            throw "PyInstaller executable was not found"
          }
          foreach ($requiredModule in @("persistent_queue.py", "timeline_utils.py", "video_screenshot_advanced.py", "streamlit_app.py")) {
            $modulePath = Get-ChildItem -Path "dist\VideoScreenshotFilter" -Filter $requiredModule -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $modulePath) {
              throw "Required runtime module was not packaged: $requiredModule"
            }
            Write-Host "Packaged runtime module: $($modulePath.FullName)"
          }
          if (-not (Test-Path "vendor\ffmpeg\ffmpeg.exe")) {
            throw "Embedded ffmpeg.exe was not found"
          }
          if (-not (Test-Path "vendor\ffmpeg\ffprobe.exe")) {
            throw "Embedded ffprobe.exe was not found"
          }
          if (-not (Test-Path "vendor\ffmpeg\BUILD_METADATA.txt")) {
            throw "FFmpeg build metadata was not found"
          }

      - name: Smoke test packaged executable
        run: |
          $env:FRAMEFORGE_AUTO_UPDATE = "0"
          $env:FRAMEFORGE_NO_BROWSER = "1"
          $process = Start-Process -FilePath "dist\VideoScreenshotFilter\VideoScreenshotFilter.exe" -PassThru -WindowStyle Hidden
          $ready = $false
          try {
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Seconds 1
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:8501/" -UseBasicParsing -TimeoutSec 3
                if ($response.StatusCode -eq 200) {
                  $ready = $true
                  break
                }
              } catch {
                # Streamlit is still starting.
              }
            }
            if (-not $ready) {
              throw "Packaged executable did not return HTTP 200 within 60 seconds"
            }
          } finally {
            if ($process -and -not $process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Install Inno Setup
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup installation failed with exit code $LASTEXITCODE"
          }

      - name: Build installer
        run: |
          cmd /c build_installer.bat
          if ($LASTEXITCODE -ne 0) {
            throw "build_installer.bat failed with exit code $LASTEXITCODE"
          }

      - name: Sign installer when certificate secrets are configured
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $setupPath = Join-Path "installer" "FrameForge-Setup-$env:FRAMEFORGE_VERSION.exe"
          "FRAMEFORGE_SIGNATURE_STATUS=unsigned" >> $env:GITHUB_ENV
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            Write-Warning "Windows signing secrets are not configured; release will be marked unsigned."
            exit 0
          }
          $certPath = Join-Path $env:RUNNER_TEMP "frameforge-signing.pfx"
          try {
            [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
            $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match "\\x64\\" } |
              Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $signTool) {
              throw "signtool.exe was not found on the Windows runner"
            }
            & $signTool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $certPath /p $env:WINDOWS_CERTIFICATE_PASSWORD $setupPath
            if ($LASTEXITCODE -ne 0) {
              throw "signtool.exe failed with exit code $LASTEXITCODE"
            }
            $signature = Get-AuthenticodeSignature $setupPath
            if ($signature.Status -ne "Valid") {
              throw "Installer signature status is $($signature.Status), expected Valid"
            }
            "FRAMEFORGE_SIGNATURE_STATUS=signed" >> $env:GITHUB_ENV
            "FRAMEFORGE_SIGNER_SUBJECT=$($signature.SignerCertificate.Subject)" >> $env:GITHUB_ENV
          } finally {
            Remove-Item $certPath -Force -ErrorAction SilentlyContinue
          }

      - name: Measure package and generate checksums
        run: |
          python measure_package_size.py . --dist-path dist\VideoScreenshotFilter --top 25 --json build_size_report.json
          $expectedSetupName = "FrameForge-Setup-$env:FRAMEFORGE_VERSION.exe"
          $setupPath = Join-Path "installer" $expectedSetupName
          if (-not (Test-Path $setupPath)) {
            throw "Expected installer executable was not found: $setupPath"
          }
          $setup = Get-Item $setupPath

          $setupHash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash
          $hashLines = @()
          $hashLines += "Setup: $($setup.Name)"
          $hashLines += "Setup SHA256: $setupHash"
          foreach ($name in @("ffmpeg.exe", "ffprobe.exe")) {
            $path = Join-Path "vendor\ffmpeg" $name
            if (Test-Path $path) {
              $hashLines += "$name SHA256: $((Get-FileHash $path -Algorithm SHA256).Hash)"
            }
          }
          $hashLines += "Profile: $env:BUILD_PROFILE"
          $hashLines += "Version: $env:FRAMEFORGE_VERSION"
          $hashLines += "Signature status: $env:FRAMEFORGE_SIGNATURE_STATUS"
          if ($env:FRAMEFORGE_SIGNER_SUBJECT) { $hashLines += "Signer subject: $env:FRAMEFORGE_SIGNER_SUBJECT" }
          $hashLines | Set-Content SHA256SUMS.txt -Encoding UTF8
          python -m pip freeze | Out-File build_environment.txt -Encoding utf8
          $notesPath = "RELEASE_NOTES.md"
          $notesContent = if (Test-Path $notesPath) { Get-Content $notesPath -Raw } else { "" }
          $releaseNotes = $notesContent.Substring(0, [Math]::Min(12000, $notesContent.Length))
          $manifest = [ordered]@{
            schema = 1
            app = "FrameForge"
            channel = $env:FRAMEFORGE_CHANNEL
            version = $env:FRAMEFORGE_VERSION
            release_tag = $env:FRAMEFORGE_TAG
            profile = $env:BUILD_PROFILE
            installer = $setup.Name
            sha256 = $setupHash.ToLowerInvariant()
            signature_status = $env:FRAMEFORGE_SIGNATURE_STATUS
            signer_subject = if ($env:FRAMEFORGE_SIGNER_SUBJECT) { $env:FRAMEFORGE_SIGNER_SUBJECT } else { $null }
            release_notes = $releaseNotes
            release_notes_url = "https://github.com/GiaHan1907/FrameForge/releases/tag/$env:FRAMEFORGE_TAG"
            installer_url = "https://github.com/GiaHan1907/FrameForge/releases/download/$env:FRAMEFORGE_TAG/$($setup.Name)"
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content latest.json -Encoding utf8
          if ($env:FRAMEFORGE_CHANNEL -eq "beta") {
            Copy-Item latest.json latest-beta.json -Force
          }
          if ($env:FRAMEFORGE_TAG -match '^v\d+\.\d+\.\d+$') {
            python validate_release_manifest.py latest.json $setup.FullName $env:FRAMEFORGE_TAG
          } else {
            Write-Host "Non-release ref $env:FRAMEFORGE_TAG; skipping release manifest validation."
          }

          "SETUP_NAME=$($setup.Name)" >> $env:GITHUB_ENV
          Write-Host "Created $($setup.FullName)"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v6
        with:
          name: frameforge-release-payload
          if-no-files-found: warn
          retention-days: 30
          path: |
            installer/FrameForge-Setup-*.exe
            build_size_report.json
            benchmark_results.json
            benchmark_results.csv
            SHA256SUMS.txt
            latest.json
            latest-beta.json
            build_environment.txt
            vendor/ffmpeg/BUILD_METADATA.txt

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name != 'workflow_dispatch' || github.event.inputs.publish_release == 'true')
    needs: windows-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout source for release validation
        uses: actions/checkout@v5

      - name: Download build artifact
        uses: actions/download-artifact@v6
        with:
          name: frameforge-release-payload
          path: release_payload

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          setup="$(find release_payload/installer -type f -name 'FrameForge-Setup-*.exe' -print -quit)"
          test -n "$setup"
          test -f release_payload/SHA256SUMS.txt
          test -f release_payload/build_size_report.json
          test -f release_payload/latest.json
          test -f release_payload/vendor/ffmpeg/BUILD_METADATA.txt
          channel="$(jq -r '.channel // "stable"' release_payload/latest.json)"
          manifest_path="release_payload/latest.json"
          if [ "$channel" = "beta" ]; then
            test -f release_payload/latest-beta.json
            manifest_path="release_payload/latest-beta.json"
          fi

          if [ "$channel" = "stable" ]; then
            previous_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=20" --jq '[.[] | select(.draft == false and .prerelease == false and .tag_name != env.GITHUB_REF_NAME) | .tag_name] | .[0]')"
            if [ -n "$previous_tag" ] && [ "$previous_tag" != "null" ]; then
              previous_manifest="$(mktemp)"
              if curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/releases/download/${previous_tag}/latest.json" -o "$previous_manifest"; then
                jq --slurpfile previous "$previous_manifest" '.rollback = {version: $previous[0].version, installer_url: $previous[0].installer_url, sha256: $previous[0].sha256, signature_status: ($previous[0].signature_status // "unsigned"), signer_subject: ($previous[0].signer_subject // null)}' "$manifest_path" > release_payload/latest.merged.json
                mv release_payload/latest.merged.json "$manifest_path"
              fi
              rm -f "$previous_manifest"
            fi
          fi
          python3 validate_release_manifest.py "$manifest_path" "$setup" "$tag"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" \
              "$setup" \
              release_payload/SHA256SUMS.txt \
              "$manifest_path" \
              release_payload/build_size_report.json \
              release_payload/vendor/ffmpeg/BUILD_METADATA.txt \
              --clobber
          elif [ "$channel" = "beta" ]; then
            gh release create "$tag" \
              "$setup" \
              release_payload/SHA256SUMS.txt \
              "$manifest_path" \
              release_payload/build_size_report.json \
              release_payload/vendor/ffmpeg/BUILD_METADATA.txt \
              --title "FrameForge ${tag#v} (Beta)" \
              --prerelease \
              --generate-notes
          else
            gh release create "$tag" \
              "$setup" \
              release_payload/SHA256SUMS.txt \
              "$manifest_path" \
              release_payload/build_size_report.json \
              release_payload/vendor/ffmpeg/BUILD_METADATA.txt \
              --title "FrameForge ${tag#v}" \
              --generate-notes
          fi
